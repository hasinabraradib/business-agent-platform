name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # The API/tests connect as the non-superuser app role (created by the test setup), so RLS
      # applies; migrations and the CLI use the owner role.
      DATABASE_URL: postgresql+asyncpg://bap_app:ci-app-password@localhost:5432/app
      OWNER_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/app
      TEST_DATABASE_NAME: app_test
      REDIS_URL: redis://localhost:6379/0
      # Tests always use fake embeddings and never reach the network; this is belt and braces.
      EMBEDDING_PROVIDER: fake

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pytest
        run: uv run pytest -v --ignore=tests/test_eval_suite.py

      # Offline providers only; writes a summary to the job page and fails below the floors
      # in evals/config.json.
      - name: Deterministic evaluation
        run: uv run python -m evaluation deterministic

  widget:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/widget

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/widget/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build (fails if widget.js exceeds its gzip budget)
        run: npm run build

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/dashboard

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and component tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  # The dashboard against the real API in Docker Compose, with the offline chat model and
  # embeddings (no keys, no network calls to AI providers): flows and accessibility checks.
  dashboard-e2e:
    runs-on: ubuntu-latest
    needs: [dashboard]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web/dashboard

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/dashboard/package-lock.json

      - name: Install dependencies and Chromium
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Build images and start the e2e stack
        working-directory: .
        run: |
          COMPOSE_PROJECT_NAME=bap-e2e docker compose -f docker-compose.yml -f docker-compose.e2e.yml build api dashboard
          ./scripts/e2e-stack.sh up

      - name: End-to-end and accessibility tests
        run: npx playwright test --project=e2e

      - name: Stack logs on failure
        if: failure()
        working-directory: .
        run: COMPOSE_PROJECT_NAME=bap-e2e docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs --tail=200 api dashboard

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/dashboard/playwright-report/
