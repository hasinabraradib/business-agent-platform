name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # The API/tests connect as the non-superuser app role (created by the test setup), so RLS
      # applies; migrations and the CLI use the owner role.
      DATABASE_URL: postgresql+asyncpg://bap_app:ci-app-password@localhost:5432/app
      OWNER_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/app
      TEST_DATABASE_NAME: app_test
      REDIS_URL: redis://localhost:6379/0
      # Tests always use fake embeddings and never reach the network; this is belt and braces.
      EMBEDDING_PROVIDER: fake

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pytest
        run: uv run pytest -v

  widget:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/widget

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/widget/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build (fails if widget.js exceeds its gzip budget)
        run: npm run build
