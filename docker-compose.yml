# Settings shared by everything that runs the backend image as the application role.
x-ingest-env: &ingest-env
  DATABASE_URL: postgresql+asyncpg://bap_app:${APP_DB_PASSWORD:-bap_app}@postgres:5432/${POSTGRES_DB:-app}
  REDIS_URL: redis://redis:6379/0
  STORAGE_DIR: /data/uploads
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-auto}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-2}
  RERANKER: ${RERANKER:-auto}
  RERANK_MODEL: ${RERANK_MODEL:-gemini-3.5-flash-lite}
  RERANK_TIMEOUT_SECONDS: ${RERANK_TIMEOUT_SECONDS:-8}
  RELEVANCE_THRESHOLD: ${RELEVANCE_THRESHOLD:-}
  CHAT_PROVIDER: ${CHAT_PROVIDER:-auto}
  CHAT_MODEL: ${CHAT_MODEL:-gemini-3.8-flash}
  HELPER_MODEL: ${HELPER_MODEL:-gemini-3.5-flash-lite}
  CHAT_RETRIEVAL_MODE: ${CHAT_RETRIEVAL_MODE:-hybrid}
  CHAT_DAILY_MESSAGE_CAP: ${CHAT_DAILY_MESSAGE_CAP:-2000}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: provisions the non-superuser app role and applies migrations as the owner role.
  # Also the place to run the platform CLI: docker compose run --rm migrate python -m app.cli ...
  migrate:
    build: ./backend
    command: sh -c "python -m app.cli ensure-app-role && alembic upgrade head"
    environment:
      <<: *ingest-env
      OWNER_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-app}
    volumes:
      - uploads:/data/uploads
      - ./demo:/demo:ro  # demo knowledge for `python -m app.cli seed-demo`
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # The API holds only the app-role credentials, so Row-Level Security always applies to it.
  api:
    build: ./backend
    environment:
      <<: *ingest-env
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Ingestion worker (arq on Redis). Also connects as the app role and binds each job's tenant.
  worker:
    build: ./backend
    command: arq app.worker.WorkerSettings
    environment:
      <<: *ingest-env
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  uploads:
