# Conversational stress cases for the demo restaurant (Nodi Kitchen, Dhaka; tenant
# demo-restaurant). Run with tests/agent_eval/run.py; format and how to add cases:
# tests/agent_eval/README.md.
#
# Each case: id, category, turns (customer messages, in order), expect, rubric.
# expect (all optional; defaults in brackets):
#   must_contain        regexes the final reply must match (case-insensitive)
#   must_not_contain    regexes no reply in the conversation may match
#   tool                a tool name, or a list (any of them), that must be called
#   tool_args           {field: regex} on that tool's arguments (create_reservation by default)
#   tools_not_called    tools that must not be called at all
#   should_handoff      [false] true: request_human ran and the conversation waits for staff;
#                       null: either is acceptable
#   should_say_dont_know  true: no_answer outcome, or says it doesn't know and offers contact
#   cite                true: the final reply is answered with a citation to the documents
#   booked              [false] true: exactly one reservation row exists for this chat
#   script              bn (Bengali script) or latin, for the final reply
#   max_chars           [1200] longest acceptable reply
#   http_status         the API must refuse the (last) message with this status, no model call
# Placeholders in turns and patterns, resolved at run time in Asia/Dhaka:
#   {d+N} long date N days from today ("Saturday 7 November"); {iso+N} the same as YYYY-MM-DD
#   {wd:fri} the next Friday after today (long); {iso_wd:fri} the same as YYYY-MM-DD

# --- a. normal questions answered from the documents -------------------------------------------

- id: normal-kacchi-price
  category: normal
  turns: ["How much is the Kacchi Biryani?"]
  expect: {must_contain: ["480"], cite: true}
  rubric: >-
    States the Kacchi Biryani (Mutton) costs 480 BDT.

- id: normal-veg-dishes
  category: normal
  turns: ["Which dishes on your menu are vegetarian?"]
  expect: {must_contain: ["Khichuri|Shobji|Begun|Dal"], cite: true}
  rubric: >-
    Lists vegetarian dishes from the menu (e.g. Bhuna Khichuri, Shobji Bhaji, Begun Bharta, Dal) without adding meat or fish dishes.

- id: normal-vegan
  category: normal
  turns: ["Do you have vegan options?"]
  expect: {must_contain: ["vegan"], cite: true}
  rubric: >-
    Says the vegetable dishes and dal are vegan (Shobji Bhaji, Begun Bharta, Dal); does not call dairy dishes vegan.

- id: normal-hours
  category: normal
  turns: ["What are your opening hours?"]
  expect: {must_contain: ["12|noon", "11"], cite: true}
  rubric: >-
    Open every day 12 noon to 11 pm, Fridays from 2:30 pm; may mention last orders at 10:30 pm.

- id: normal-friday-hours
  category: normal
  turns: ["What time do you open on Friday?"]
  expect: {must_contain: ["2:30|2\\.30|14:30"], cite: true}
  rubric: >-
    Fridays open at 2:30 pm (after Jumu'ah prayers).

- id: normal-location
  category: normal
  turns: ["Where are you located?"]
  expect: {must_contain: ["Dhanmondi", "27|9/A"], cite: true}
  rubric: >-
    House 27, Road 9/A, Dhanmondi, Dhaka 1209, first floor above a pharmacy.

- id: normal-parking
  category: normal
  turns: ["Is there parking at the restaurant?"]
  expect: {must_contain: ["six|6"], cite: true}
  rubric: >-
    Limited parking for six cars in front of the building, after 6 pm.

- id: normal-prawn-allergens
  category: normal
  turns: ["What allergens are in the Chingri Malai Curry?"]
  expect: {must_contain: ["shellfish"], cite: true}
  rubric: >-
    Shellfish and dairy.

- id: normal-gluten
  category: normal
  turns: ["Which of your dishes contain gluten?"]
  expect: {must_contain: ["paratha"], cite: true}
  rubric: >-
    The menu lists gluten only for the Paratha; a good answer also notes the kitchen can't guarantee dishes are free of traces, or advises telling staff. It must not certify anything as gluten-free beyond the menu's allergen lists.

- id: normal-halal
  category: normal
  turns: ["Is your meat halal?"]
  expect: {must_contain: ["halal"], cite: true}
  rubric: >-
    Yes, all meat and poultry is halal; no alcohol or pork served.

- id: normal-delivery
  category: normal
  turns: ["Do you deliver, and how much does delivery cost?"]
  expect: {must_contain: ["5 ?km", "60"], cite: true}
  rubric: >-
    Delivers within 5 km with own riders, 1 pm to 10 pm; free over 1,500 BDT, otherwise 60 BDT.

- id: normal-payment
  category: normal
  turns: ["Can I pay with bKash?"]
  expect: {must_contain: ["bkash"], cite: true}
  rubric: >-
    Yes; also accepts cash, Visa, Mastercard and Nagad. May mention 5% VAT.

- id: normal-kids
  category: normal
  turns: ["Do you have anything for kids?"]
  expect: {must_contain: ["220|half"], cite: true}
  rubric: >-
    Children's half portion of Morog Polao for 220 BDT; high chairs available.

- id: normal-spice
  category: normal
  turns: ["Can the Beef Kala Bhuna be made mild?"]
  expect: {must_contain: ["not|can't|cannot"], cite: true}
  rubric: >-
    No; Beef Kala Bhuna (like Shorshe Ilish) is traditionally hot and can't be made fully mild.

- id: normal-private-room
  category: normal
  turns: ["Do you have a private room for a birthday party?"]
  expect: {must_contain: ["20"], cite: true}
  rubric: >-
    A separate room seats up to 20 and must be booked at least three days ahead.

- id: normal-deposit
  category: normal
  turns: ["Is there a deposit for big groups?"]
  expect: {must_contain: ["1,?000"], cite: true}
  rubric: >-
    Groups of eight or more pay a 1,000 BDT deposit, deducted from the bill and refunded if cancelled at least 24 hours ahead.

# --- b. messy versions of the same questions ---------------------------------------------------

- id: messy-kacchi-typo
  category: messy
  turns: ["how mch is kachi biriyani"]
  expect: {must_contain: ["480"], cite: true}
  rubric: >-
    Understands the typos and gives 480 BDT for Kacchi Biryani.

- id: messy-open-now
  category: messy
  turns: ["open now?"]
  expect: {must_contain: ["open|closed|12|noon|2:30|11"]}
  rubric: >-
    Uses the current Dhaka time and the hours (daily 12 noon-11 pm, Friday from 2:30 pm) to say whether it is open now, or at least gives today's hours. Must not guess hours not in the documents.

- id: messy-veg-short
  category: messy
  turns: ["veg?"]
  expect: {must_contain: ["veg|vegan|Khichuri|Shobji|Begun|Dal"]}
  rubric: >-
    Interprets "veg?" as asking about vegetarian options and lists some, or asks a short clarifying question.

- id: messy-parking-lower
  category: messy
  turns: ["parking available or no"]
  expect: {must_contain: ["six|6"], cite: true}
  rubric: >-
    Limited parking for six cars after 6 pm.

- id: messy-slang-location
  category: messy
  turns: ["yo whr u guys at"]
  expect: {must_contain: ["Dhanmondi"], cite: true}
  rubric: >-
    Gives the address in Dhanmondi despite the slang, in a friendly but not slangy-mocking tone.

- id: messy-emoji-price
  category: messy
  turns: ["🍗🍚 morog polao price?? 🙏"]
  expect: {must_contain: ["380"], cite: true}
  rubric: >-
    Morog Polao costs 380 BDT.

- id: messy-no-punct-delivery
  category: messy
  turns: ["do u deliver to dhanmondi lake area whats the charge"]
  expect: {must_contain: ["60|free|1,?500"], cite: true}
  rubric: >-
    Delivery within 5 km (the lake is about five minutes away, so it qualifies); 60 BDT or free over 1,500 BDT. Must not promise a delivery time not in the documents.

- id: messy-allcaps
  category: messy
  turns: ["IS THE FOOD HALAL"]
  expect: {must_contain: ["halal"], cite: true}
  rubric: >-
    Yes, halal; replies in normal case, not shouting.

- id: messy-typo-allergy
  category: messy
  turns: ["does firni hav nuts in it"]
  expect: {must_contain: ["nut|pistachio"], cite: true}
  rubric: >-
    Yes, Firni contains dairy and nuts (pistachio).

- id: messy-rambling-hours
  category: messy
  turns: ["hi so me and my cousins were thinking maybe we come over sometime this week, we were at the mall earlier and honestly everyone is starving, my aunt says your kacchi is the best in dhanmondi but she always says that lol, anyway the main thing is what time do you close tonight because we might be late"]
  expect: {must_contain: ["11|10:30"], cite: true}
  rubric: >-
    Picks out the real question and gives closing time 11 pm (last orders 10:30 pm). Brief; doesn't echo the whole story.

- id: messy-rambling-vegan
  category: messy
  turns: ["ok long story but my sister just went vegan like two weeks ago and she is very strict about it, no ghee no yoghurt nothing, and we're planning a family dinner and everyone else wants biryani which obviously she can't eat, so is there literally anything at your place she can actually eat or should we go somewhere else"]
  expect: {must_contain: ["Shobji|Begun|Dal"], cite: true}
  rubric: >-
    Names the vegan dishes (Shobji Bhaji, Begun Bharta, Dal) and doesn't suggest ghee or dairy dishes (e.g. Bhuna Khichuri has dairy). May mention trace risk.

- id: messy-very-short-price
  category: messy
  turns: ["dal?"]
  expect: {must_contain: ["120|dal"]}
  rubric: >-
    Interprets as a question about the Dal (Masoor) and gives its price 120 BDT or a short description; or asks briefly what they'd like to know.

- id: messy-mixed-typos-payment
  category: messy
  turns: ["card accpeted? visa master?"]
  expect: {must_contain: ["visa|mastercard"], cite: true}
  rubric: >-
    Yes, Visa and Mastercard are accepted.

- id: messy-kids-slang
  category: messy
  turns: ["got smth for my 5yo? she's picky af"]
  expect: {must_contain: ["220|half|Morog"], cite: true}
  rubric: >-
    Mentions the children's half portion of Morog Polao (220 BDT) and/or high chairs; polite despite slang.

- id: messy-emoji-only-question
  category: messy
  turns: ["🅿️❓"]
  expect: {}
  rubric: >-
    Either interprets it as a parking question and answers (six cars after 6 pm) or asks a short, friendly clarifying question. Must not invent facts.

- id: messy-repeated-chars
  category: messy
  turns: ["helloooo do u have mishti doiiii"]
  expect: {must_contain: ["120|mishti"], cite: true}
  rubric: >-
    Yes, Mishti Doi is on the menu (120 BDT).

# --- c. other languages ------------------------------------------------------------------------
