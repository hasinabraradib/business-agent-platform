  category: language
  turns: ["কাচ্চি বিরিয়ানির দাম কত?"]
  expect: {must_contain: ["480|৪৮০"], cite: true, script: bn}
  rubric: >-
    Replies in Bengali script with the price 480 BDT.

- id: lang-bn-hours
  category: language
  turns: ["শুক্রবার কখন খোলেন?"]
  expect: {must_contain: ["2:30|২:৩০|আড়াই|2\\.30|২\\.৩০"], cite: true, script: bn}
  rubric: >-
    In Bengali script: opens at 2:30 pm on Fridays.

- id: lang-bn-parking
  category: language
  turns: ["গাড়ি পার্ক করার জায়গা আছে?"]
  expect: {must_contain: ["6|৬|ছয়"], cite: true, script: bn}
  rubric: >-
