<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Widget demos</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f6f8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", sans-serif; color: #111; }
  main { width: min(640px, calc(100% - 32px)); }
  h1 { font-size: 28px; margin: 0 0 6px; }
  p { color: #5c6370; margin: 0 0 24px; }
  .cards { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
  a { display: block; padding: 24px; border-radius: 24px; background: #fff; color: inherit;
    text-decoration: none; box-shadow: 0 12px 32px -16px rgba(17,17,17,.25); }
  a:focus-visible, a:hover { box-shadow: 0 0 0 3px rgba(109,92,232,.45), 0 12px 32px -16px rgba(17,17,17,.25); }
  .swatch { height: 72px; border-radius: 16px; margin-bottom: 16px; }
  .nodi .swatch { background: linear-gradient(135deg, #b5432f, #e9a23b); }
  .jamdani .swatch { background: repeating-linear-gradient(45deg, #1f2a5a 0 10px, #f2c14e 10px 14px, #1f2a5a 14px 24px); }
  strong { font-size: 18px; }
  span { display: block; color: #5c6370; margin-top: 4px; }
</style>
</head>
<body>
<main>
  <h1>Chat widget demos</h1>
  <p>Two invented businesses, one widget, two looks.</p>
  <div class="cards">
    <a class="nodi" href="nodi-kitchen/"><div class="swatch"></div><strong>Nodi Kitchen</strong><span>A Bengali restaurant in Dhanmondi</span></a>
    <a class="jamdani" href="jamdani-lane/"><div class="swatch"></div><strong>Jamdani Lane</strong><span>A small online handloom shop</span></a>
  </div>
</main>
</body>
</html>
